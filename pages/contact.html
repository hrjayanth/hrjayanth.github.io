<section id="contact" class="section">
    <div class="section-content reveal">
        <h2>Contact Me</h2>
        <p class="contact">
            Have a project in mind or want to discuss opportunities?
            Feel free to reach out.
        </p>

        <form id="contactForm" class="contact-form mt-4">
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Your Name" required>
            </div>

            <div class="mb-3">
                <input type="email" class="form-control" placeholder="Your Email" required>
            </div>

            <div class="mb-3">
                <textarea class="form-control" rows="5" placeholder="Your Message" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Send Message
            </button>
        </form>

        <div class="social-icons mt-4">
            <a href="https://www.linkedin.com/in/jayanta-ramanatha-a6245846/"><i class="bi bi-linkedin"></i></a>
            <a href="https://github.com/hrjayanth"><i class="bi bi-github"></i></a>
        </div>
    </div>
</section>
